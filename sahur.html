<div id="clickcatch" aria-hidden="true"></div>
<script>
  // Auto-open the framed app as an about:blank tab on load, then hand this
  // tab to the decoy so no duplicate app instance runs behind it. The
  // written shell carries the same DeltaMath title, favicon and
  // confirm-close as this wrapper.
  //
  // window.open outside a user gesture is blocked by default. When auto
  // fails, the DeltaMath cover stays AND the first click on it retries with
  // a real gesture, which popups allow. So there are three outcomes, in
  // order: blank on load, blank on first click, or the inline app revealed
  // with confirm armed.
  //
  // SVG_URL and FAVICON are read off this document rather than duplicated,
  // so editing the iframe or icon above automatically updates every flow.
  // The icon is a data: URI, self-contained in any document including the
  // about:blank blank tab, which has no base for relative hrefs.
  //
  // The confirm handler attaches only on staying paths, and a successful
  // click-open removes it before navigating — otherwise either hop would
  // prompt on its own self-navigation.
  (function () {
    var SVG_URL = "";
    var FAVICON = "";
    try {
      var frame = document.querySelector("iframe");
      if (frame) SVG_URL = frame.getAttribute("src") || "";
      var icon = document.querySelector('link[rel="icon"]');
      if (icon) FAVICON = icon.getAttribute("href") || "";
    } catch (e) {}
    var DECOY = "https://www.deltamath.com/";

    function shellHtml() {
      return "<!doctype html><html><head><title>DeltaMath</title>" +
        (FAVICON ? '<link rel="icon" href="' + FAVICON + '">' : "") +
        "<style>html,body{margin:0;height:100%;background:#000}" +
        "iframe{border:0;width:100vw;height:100vh;display:block}</style>" +
        "</head><body>" +
        '<iframe src="' + SVG_URL + '" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>' +
        "<script>window.addEventListener(\"beforeunload\",function(e){e.preventDefault();e.returnValue=\"\";});<\/script>" +
        "</body></html>";
    }

    function openBlank() {
      if (!SVG_URL) return false;
      var w = null;
      try {
        w = window.open("about:blank", "_blank");
      } catch (e) {
        w = null;
      }
      if (!w) return false;
      try {
        w.document.open();
        w.document.write(shellHtml());
        w.document.close();
        w.focus();
      } catch (e) {
        return false;
      }
      return true;
    }

    function onBeforeUnload(e) {
      e.preventDefault();
      e.returnValue = "";
    }

    function goDecoy() {
      try {
        location.replace(DECOY);
      } catch (e) {}
    }

    // 1. Try on load.
    if (openBlank()) {
      goDecoy();
      return;
    }

    // 2. Auto failed: confirm arms here, and the cover click retries with
    // a real gesture (clicks inside a cross-origin frame never reach this
    // window, so the cover — not a window listener — carries the retry).
    window.addEventListener("beforeunload", onBeforeUnload);
    var cover = document.getElementById("cover");
    var catcher = document.getElementById("clickcatch");
    if (!catcher) return;
    catcher.addEventListener("click", function () {
      if (openBlank()) {
        // Leaving on purpose — drop the guard so the hop is silent.
        try {
          window.removeEventListener("beforeunload", onBeforeUnload);
        } catch (e) {}
        goDecoy();
      } else {
        // Even a gesture couldn't open it — reveal the inline app and get
        // out of the way, with confirm still armed.
        try {
          if (cover) cover.remove();
          catcher.remove();
        } catch (e) {}
      }
    }, { once: true });
  })();
</script>
